# Values for the argocd-apps chart (helm_release.argocd_root_app): the root "app of apps" Application.
# ArgoCD syncs every Application in argocd/applications/ of the Gitea mirror of homelab-argocd-config.
applications:
  root:
    namespace: argocd
    project: default
    source:
      repoURL: http://192.168.1.117/homelab/homelab-argocd-config.git
      targetRevision: HEAD
      path: argocd/applications
    destination:
      server: https://kubernetes.default.svc
      namespace: argocd
    syncPolicy:
      automated:
        prune: true      # an Application removed from git is removed from the cluster
        selfHeal: true   # manual changes in the cluster are reverted to match git
