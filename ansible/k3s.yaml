---
# k3s cluster install and upgrade via the k3s-io/k3s-ansible collection (requirements.yaml)
# Settings are in group_vars/k3s_cluster.yaml, hosts in the server and agent groups of hosts.ini
# Install: ansible-playbook k3s.yaml
# Upgrade: bump k3s_version, then ansible-playbook k3s.yaml -e k3s_server_serial=1
# Tear down: ansible-playbook k3s.orchestration.reset

# Proxmox has the agent enabled on the k3s VMs; the Debian cloud image doesn't ship it.
# udev starts it once the VM has the agent device, after a stop/start from Proxmox
- name: Install the QEMU guest agent on the k3s VMs
  hosts: k3s_control:k3s_workers
  gather_facts: false
  become: true
  tasks:
    - name: Install qemu-guest-agent
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present
        update_cache: true
        cache_valid_time: 3600

- name: Install k3s
  ansible.builtin.import_playbook: k3s.orchestration.site

# A node can't give itself a node-role.kubernetes.io label, so it's set from the first server
- name: Label the agents as workers
  hosts: agent
  gather_facts: false
  tasks:
    - name: Add the worker role label
      ansible.builtin.command:
        cmd: k3s kubectl label node {{ inventory_hostname }} node-role.kubernetes.io/worker=worker --overwrite
      delegate_to: "{{ groups['server'][0] }}"
      become: true
      register: k3s_worker_label
      changed_when: "'not labeled' not in k3s_worker_label.stdout"

# The cluster's Pulse agent (homelab-argocd-config, LAB-121) reads its token from this Secret,
# which stays out of the public repo. Run on its own with --tags monitoring
- name: Give the Pulse Kubernetes agent its token
  hosts: server[0]
  gather_facts: false
  become: true
  tags: monitoring
  tasks:
    - name: Check for the agent's Secret
      ansible.builtin.command:
        cmd: k3s kubectl -n pulse get secret pulse-agent-env
      register: pulse_agent_secret
      changed_when: false
      failed_when: pulse_agent_secret.rc not in [0, 1]

    - name: Get a token for the agent
      ansible.builtin.import_role:
        name: pulse_agent
        tasks_from: token
      vars:
        pulse_agent_token_name: agent-k3s
        pulse_agent_token_scopes:
          - kubernetes:report
        pulse_agent_installed: "{{ pulse_agent_secret.rc == 0 }}"

    # Through stdin, so the token never reaches the command line
    - name: Write the token to the agent's Secret
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl create namespace pulse --dry-run=client -o yaml | k3s kubectl apply -f -
          k3s kubectl -n pulse create secret generic pulse-agent-env --from-file=PULSE_TOKEN=/dev/stdin \
            --dry-run=client -o yaml | k3s kubectl apply --server-side -f -
        executable: /bin/bash
        stdin: "{{ pulse_agent_token_new.json.token }}"
        stdin_add_newline: false
      changed_when: true
      no_log: true
      when: pulse_agent_token_new is changed

    # The agent reads the token at startup; a first-time Secret needs no restart, the pod is waiting for it
    - name: Restart the agent onto the new token
      ansible.builtin.command:
        cmd: k3s kubectl -n pulse rollout restart deployment/pulse-agent
      changed_when: true
      when: pulse_agent_token_new is changed and pulse_agent_secret.rc == 0

# The k3s Alertmanager (homelab-argocd-config, LAB-124) reads the Slack webhook from this Secret,
# which stays out of the public repo. Alertmanager rereads the file, so a new URL needs no restart
- name: Give the k3s Alertmanager the Slack webhook
  hosts: server[0]
  gather_facts: false
  become: true
  tags: monitoring
  tasks:
    - name: Read the webhook in the Alertmanager Secret
      ansible.builtin.command:
        cmd: k3s kubectl -n monitoring get secret alertmanager-slack -o jsonpath={.data.url}
      register: alertmanager_slack_secret
      changed_when: false
      failed_when: alertmanager_slack_secret.rc not in [0, 1]
      no_log: true

    # Through stdin, so the webhook never reaches the command line
    - name: Write the webhook to the Alertmanager Secret
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl create namespace monitoring --dry-run=client -o yaml | k3s kubectl apply -f -
          k3s kubectl -n monitoring create secret generic alertmanager-slack --from-file=url=/dev/stdin \
            --dry-run=client -o yaml | k3s kubectl apply --server-side -f -
        executable: /bin/bash
        stdin: "{{ slack_alerting_webhook }}"
        stdin_add_newline: false
      changed_when: true
      no_log: true
      when: alertmanager_slack_secret.stdout | b64decode != slack_alerting_webhook
