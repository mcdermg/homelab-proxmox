---
# Main playbook for LXC container configuration via Proxmox host
# This playbook configures stopped TurnKey LXC containers by:
# 1. Mounting container filesystem with pct
# 2. Copying init scripts to firstboot hooks
# 3. Configuring inithooks.conf
# 4. Unmounting container
# 5. Starting container (handlers)

# NVMe and PCIe power saving off (LAB-113): pve01's NVMe dropped off PCIe on 2026-10-14.
# ASPM (LAB-132): it dropped again on 2026-10-18 with ASPM L1 and its L1.1/L1.2 substates still on. The firmware
# (FADT) keeps ASPM, so the kernel would leave the BIOS value, and pve01's BIOS has no option for it. Secure Boot's
# lockdown blocks setpci, so pcie_aspm=force makes the kernel take ASPM over and the performance policy turns it off.
# Takes effect after a reboot, which is left to be done by hand, one node at a time
- name: Turn off NVMe and PCIe power saving on the Proxmox nodes
  hosts: proxmox
  gather_facts: false
  become: true

  tasks:
    - name: Add the kernel parameters to GRUB
      ansible.builtin.copy:
        dest: /etc/default/grub.d/nvme-power.cfg
        content: |
          # Managed by Ansible (homelab-proxmox playbook.yaml)
          GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT nvme_core.default_ps_max_latency_us=0 pcie_port_pm=off pcie_aspm=force pcie_aspm.policy=performance"
        mode: '0644'
      notify: Update GRUB

  handlers:
    - name: Update GRUB
      ansible.builtin.command:
        cmd: update-grub
      changed_when: true

# Host metrics on :9100 for Prometheus (LAB-90). The k3s nodes get node_exporter from the cluster's DaemonSet instead
- name: Install node_exporter on the Proxmox nodes
  hosts: proxmox
  gather_facts: false
  become: true
  tags: monitoring

  tasks:
    - name: Install prometheus-node-exporter
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present
        update_cache: true
        cache_valid_time: 3600

- name: Configure LXC containers via Proxmox host
  hosts: proxmox
  gather_facts: false
  become: true

  tasks:
    - name: Verify required variables are defined
      ansible.builtin.assert:
        that:
          - postgres_ctid is defined
          - gitea_ctid is defined
          - postgres_ip is defined
          - gitea_ip is defined
          - bind9_ips is defined
          - bind9_vip is defined
          - cloudflare_tunnel_id is defined
          - cloudflare_tunnel_token is defined
        fail_msg: "Required container variables not defined in inventory"

- name: Configure PostgreSQL container
  hosts: postgres_node
  gather_facts: false
  roles:
    - postgres

  post_tasks:
    - name: Force all handlers to run now
      ansible.builtin.meta: flush_handlers

- name: Configure Gitea container (depends on PostgreSQL)
  hosts: gitea_node
  gather_facts: false
  roles:
    - gitea

- name: Configure Bind9 container
  hosts: bind9_node
  gather_facts: true
  roles:
    - bind9

  post_tasks:
    - name: Force all handlers to run now
      ansible.builtin.meta: flush_handlers

    - name: Wait for BIND9 installation to complete
      ansible.builtin.shell:
        cmd: "pct exec {{ bind9_ctid }} -- test -f /var/lib/inithooks/.99custom-bind9-init.done"
      register: bind9_install_check
      until: bind9_install_check.rc == 0
      retries: 60
      delay: 10
      become: true
      changed_when: false

    - name: Wait for BIND9 service to be active
      ansible.builtin.shell:
        cmd: "pct exec {{ bind9_ctid }} -- systemctl is-active named"
      register: bind9_service_check
      until: bind9_service_check.stdout == "active"
      retries: 10
      delay: 5
      become: true
      changed_when: false

    - name: Verify DNS forward lookup
      ansible.builtin.command:
        cmd: "nslookup gitea.homelab.local {{ bind9_ip }}"
      register: dns_forward_check
      failed_when: "'192.168.1.117' not in dns_forward_check.stdout"
      changed_when: false

    - name: Verify DNS reverse lookup
      ansible.builtin.command:
        cmd: "nslookup 192.168.1.117 {{ bind9_ip }}"
      register: dns_reverse_check
      failed_when: "'gitea.homelab.local' not in dns_reverse_check.stdout"
      changed_when: false

    - name: Display BIND9 setup completion
      ansible.builtin.debug:
        msg:
          - "================================"
          - "BIND9 DNS server is ready!"
          - "DNS Server: {{ bind9_ip }}"
          - "Test from any host: nslookup gitea.homelab.local {{ bind9_ip }}"
          - "================================"
          - "Forward lookup: gitea.homelab.local → 192.168.1.117 ✓"
          - "Reverse lookup: 192.168.1.117 → gitea.homelab.local ✓"
          - "================================"

# One DNS IP on whichever bind9 is up, so the MikroTik has a single server to forward to (LAB-117)
- name: Float the DNS IP between the bind9 servers
  hosts: bind9
  gather_facts: false
  roles:
    - keepalived

- name: Configure cloudflared container via Proxmox
  hosts: cloudflared_node
  gather_facts: false
  roles:
    - cloudflared

  post_tasks:
    - name: Force handlers to run (start container)
      ansible.builtin.meta: flush_handlers

    - name: Wait for cloudflared container SSH to be available
      ansible.builtin.wait_for:
        host: "{{ cloudflared_ip }}"
        port: 22
        delay: 5
        timeout: 60
      delegate_to: localhost

- name: Install and configure cloudflared on container
  hosts: cloudflared
  gather_facts: true

  tasks:
    - name: Check if cloudflared is already installed
      ansible.builtin.command:
        cmd: which cloudflared
      register: cloudflared_binary_check
      changed_when: false
      failed_when: false

    - name: Check if cloudflared service exists and is active
      ansible.builtin.systemd:
        name: cloudflared
      register: cloudflared_service_check
      failed_when: false

    - name: Set cloudflared installation status
      ansible.builtin.set_fact:
        cloudflared_needs_install: "{{ cloudflared_binary_check.rc != 0 or cloudflared_service_check.status is not defined or cloudflared_service_check.status.ActiveState != 'active' }}"

    - name: Display cloudflared configuration start
      ansible.builtin.debug:
        msg:
          - "================================"
          - "Starting cloudflared installation..."
          - "Container IP: {{ ansible_host }}"
          - "Tunnel ID: {{ cloudflare_tunnel_id }}"
          - "================================"
      when: cloudflared_needs_install

    - name: Display cloudflared already configured
      ansible.builtin.debug:
        msg:
          - "================================"
          - "Cloudflared already installed and running"
          - "Skipping installation..."
          - "================================"
      when: not cloudflared_needs_install

    # Every run, so existing containers get the repo too and update.yaml can upgrade them
    - name: Add the cloudflared apt repo
      ansible.builtin.include_tasks: tasks/cloudflared_apt_repo.yaml

    - name: Install cloudflared package
      ansible.builtin.apt:
        name: cloudflared
        state: present
        update_cache: true
      when: cloudflared_needs_install

    - name: Install the tunnel as a systemd service
      ansible.builtin.command:
        cmd: cloudflared service install {{ cloudflare_tunnel_token }}
      args:
        creates: /etc/systemd/system/cloudflared.service
      when: cloudflared_needs_install

    - name: Start and enable cloudflared service
      ansible.builtin.systemd:
        name: cloudflared
        state: started
        enabled: true
        daemon_reload: true
      when: cloudflared_needs_install

  post_tasks:
    - name: Display cloudflared setup completion
      ansible.builtin.debug:
        msg:
          - "================================"
          - "Cloudflare Tunnel is ready!"
          - "Container IP: {{ ansible_host }}"
          - "Tunnel ID: {{ cloudflare_tunnel_id }}"
          - "================================"

# cloudflared only serves metrics on localhost by default; TUNNEL_METRICS moves them to the container IP so the
# k3s Prometheus can scrape them (LAB-164). One container at a time, so the other replica keeps the tunnel up
- name: Expose cloudflared metrics to Prometheus
  hosts: cloudflared
  gather_facts: false
  serial: 1
  tags: monitoring
  tasks:
    - name: Create the cloudflared drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/cloudflared.service.d
        state: directory
        mode: '0755'

    - name: Listen for metrics on the container IP
      ansible.builtin.copy:
        dest: /etc/systemd/system/cloudflared.service.d/metrics.conf
        content: |
          [Service]
          Environment=TUNNEL_METRICS={{ ansible_host }}:{{ cloudflared_metrics_port }}
        mode: '0644'
      register: cloudflared_metrics_dropin

    - name: Restart cloudflared onto the metrics address
      ansible.builtin.systemd:
        name: cloudflared
        state: restarted
        daemon_reload: true
      when: cloudflared_metrics_dropin is changed

    # /ready returns 200 once the tunnel is connected again, so the next container only restarts after this one is back
    - name: Wait for the tunnel to reconnect
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ cloudflared_metrics_port }}/ready"
      register: cloudflared_ready
      until: cloudflared_ready.status == 200
      retries: 12
      delay: 5

# Plain Debian 13 containers: OpenTofu creates and starts them with the root SSH key, so these plays connect directly
# raw needs no temp dir, so creating it here stops the first module run on a fresh container warning that it had to
- name: Prepare the SSH-managed containers
  hosts: ssh_containers
  gather_facts: false
  tasks:
    - name: Create Ansible's remote temp directory
      ansible.builtin.raw: mkdir -p -m 0700 ~/.ansible/tmp
      changed_when: false

- name: Install LibreSpeed
  hosts: librespeed_host
  gather_facts: false
  roles:
    - librespeed

- name: Install and configure Pulse
  hosts: pulse_host
  gather_facts: false
  tags: monitoring
  roles:
    - pulse

# The Pis aren't in Proxmox, so Pulse only sees them through an agent (LAB-120)
- name: Install the Pulse agent on the Raspberry Pis
  hosts: k3s_pis
  gather_facts: false
  become: true
  tags: monitoring
  roles:
    - pulse_agent
