---
# k3s-ansible collection settings, used by k3s.yaml
k3s_version: v1.36.5+k3s1
api_endpoint: "{{ hostvars[groups['server'][0]]['ansible_host'] }}"
cluster_context: k3s

# Joining servers' config.yaml holds the cluster token
k3s_server_config_mode: "0600"

# Nodes register under their inventory name, not the OS hostname (the Pis are control and node-1)
# servicelb off so MetalLB can take LoadBalancer IPs; control planes only run critical add-ons
server_config_yaml: |
  node-name: {{ inventory_hostname }}
  disable:
    - servicelb
  node-taint:
    - CriticalAddonsOnly=true:NoExecute
agent_config_yaml: |
  node-name: {{ inventory_hostname }}
