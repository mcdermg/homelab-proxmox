---
# roles/bind9/tasks/main.yaml
- name: Check if bind9 container already configured (inithooks completed)
  ansible.builtin.shell:
    cmd: "pct exec {{ bind9_ctid }} -- stat -c %s /etc/inithooks.conf 2>/dev/null || echo 999"
  register: bind9_inithooks_check
  become: true
  changed_when: false

- name: Set bind9 configuration status
  ansible.builtin.set_fact:
    bind9_needs_config: "{{ bind9_inithooks_check.stdout | int > 1 }}"

- name: Stop bind9 container if needs configuration
  ansible.builtin.shell: "if pct status {{ bind9_ctid }} | grep -q running; then pct stop {{ bind9_ctid }} && echo stopped; fi"
  register: bind9_stop
  changed_when: "'stopped' in bind9_stop.stdout"
  become: true
  when: bind9_needs_config

- name: Mount bind9 container for file operations
  ansible.builtin.command:
    cmd: "pct mount {{ bind9_ctid }}"
  become: true
  changed_when: false
  when: bind9_needs_config

- name: Create bind9 init script in firstboot hooks
  ansible.builtin.copy:
    src: bind9-init.sh
    dest: "/var/lib/lxc/{{ bind9_ctid }}/rootfs/usr/lib/inithooks/firstboot.d/99custom-bind9-init"
    mode: '0755'
    owner: 100000
    group: 100000
  become: true
  notify: Start bind9 container
  when: bind9_needs_config

- name: Configure bind9 inithooks.conf
  ansible.builtin.template:
    src: inithooks.conf.j2
    dest: "/var/lib/lxc/{{ bind9_ctid }}/rootfs/etc/inithooks.conf"
    mode: '0644'
    owner: 100000
    group: 100000
  become: true
  notify: Start bind9 container
  when: bind9_needs_config

- name: Ensure .ssh directory exists
  ansible.builtin.file:
    path: "/var/lib/lxc/{{ bind9_ctid }}/rootfs/root/.ssh"
    state: directory
    mode: '0700'
    owner: 100000
    group: 100000
  become: true
  when: bind9_needs_config

- name: Add SSH public key to authorized_keys
  ansible.builtin.copy:
    content: "{{ lxc_ssh_public_key }}\n"
    dest: "/var/lib/lxc/{{ bind9_ctid }}/rootfs/root/.ssh/authorized_keys"
    mode: '0600'
    owner: 100000
    group: 100000
  become: true
  when: bind9_needs_config

- name: Create Ansible remote_tmp directory to prevent permission warnings
  ansible.builtin.file:
    path: "/var/lib/lxc/{{ bind9_ctid }}/rootfs/root/.ansible/tmp"
    state: directory
    mode: '0700'
    owner: 100000
    group: 100000
  become: true
  when: bind9_needs_config

- name: Create zones directory
  ansible.builtin.file:
    path: "/var/lib/lxc/{{ bind9_ctid }}/rootfs/etc/bind/zones"
    state: directory
    mode: '0755'
    owner: 100000
    group: 100000
  become: true
  when: bind9_needs_config

- name: Deploy named.conf.options configuration
  ansible.builtin.template:
    src: named.conf.options.j2
    dest: "/var/lib/lxc/{{ bind9_ctid }}/rootfs/etc/bind/named.conf.options"
    mode: '0644'
    owner: 100000
    group: 100000
  become: true
  when: bind9_needs_config

- name: Deploy named.conf.local zone configuration
  ansible.builtin.template:
    src: named.conf.j2
    dest: "/var/lib/lxc/{{ bind9_ctid }}/rootfs/etc/bind/named.conf.local"
    mode: '0644'
    owner: 100000
    group: 100000
  become: true
  when: bind9_needs_config

- name: Deploy forward zone file (db.homelab.local)
  ansible.builtin.template:
    src: db.homelab.local.j2
    dest: "/var/lib/lxc/{{ bind9_ctid }}/rootfs/etc/bind/zones/db.homelab.local"
    mode: '0644'
    owner: 100000
    group: 100000
  become: true
  when: bind9_needs_config

- name: Deploy reverse zone file (db.1.168.192.in-addr.arpa)
  ansible.builtin.template:
    src: db.1.168.192.in-addr.arpa.j2
    dest: "/var/lib/lxc/{{ bind9_ctid }}/rootfs/etc/bind/zones/db.1.168.192.in-addr.arpa"
    mode: '0644'
    owner: 100000
    group: 100000
  become: true
  when: bind9_needs_config

- name: Create ansible configuration marker
  ansible.builtin.copy:
    content: "Configured by Ansible"
    dest: "/var/lib/lxc/{{ bind9_ctid }}/rootfs/root/.ansible_configured"
    mode: '0644'
    owner: 100000
    group: 100000
  become: true
  when: bind9_needs_config

- name: Unmount bind9 container
  ansible.builtin.command:
    cmd: "pct unmount {{ bind9_ctid }}"
  become: true
  changed_when: false
  when: bind9_needs_config

# The zones above are only written on first configuration, so later record changes are pushed here.
# They're compared with the live zones in the container, ignoring the serial, so a run only pushes and
# reloads bind when a record changed. Nothing is kept on the node: the temporary folder is always removed.
- name: Update the zones on a configured bind9 container
  when: not bind9_needs_config
  become: true
  vars:
    bind9_zones:
      - db.homelab.local
      - db.1.168.192.in-addr.arpa
    bind9_changed_zones: "{{ bind9_zone_diff.results | selectattr('rc', 'ne', 0) | map(attribute='item') | list }}"
  block:
    - name: Create a temporary folder for the zones on the node
      ansible.builtin.tempfile:
        state: directory
        suffix: -bind9-zones
      register: bind9_zone_tmp

    - name: Render the zones with a fixed serial for the comparison
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "{{ bind9_zone_tmp.path }}/{{ item }}.compare"
        mode: '0600'
      vars:
        bind9_zone_serial: 0
      loop: "{{ bind9_zones }}"

    - name: Compare with the live zones in the container, ignoring the serial
      ansible.builtin.shell:
        cmd: >-
          pct exec {{ bind9_ctid }} -- cat /etc/bind/zones/{{ item }} | grep -v '; Serial' |
          diff -q - <(grep -v '; Serial' {{ bind9_zone_tmp.path }}/{{ item }}.compare)
        executable: /bin/bash
      register: bind9_zone_diff
      changed_when: false
      failed_when: bind9_zone_diff.rc > 1
      loop: "{{ bind9_zones }}"

    - name: Render the changed zones with a new serial
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "{{ bind9_zone_tmp.path }}/{{ item }}"
        mode: '0644'
      loop: "{{ bind9_changed_zones }}"

    - name: Push the changed zones into the container, check them and swap them in
      ansible.builtin.shell: >-
        pct push {{ bind9_ctid }} {{ bind9_zone_tmp.path }}/{{ item }} /etc/bind/zones/{{ item }}.new --perms 0644 &&
        pct exec {{ bind9_ctid }} -- sh -c
        'named-checkzone {{ item | regex_replace('^db[.]', '') }} /etc/bind/zones/{{ item }}.new &&
        mv /etc/bind/zones/{{ item }}.new /etc/bind/zones/{{ item }}'
      loop: "{{ bind9_changed_zones }}"

    - name: Reload bind9
      ansible.builtin.command:
        cmd: "pct exec {{ bind9_ctid }} -- rndc reload"
      when: bind9_changed_zones | length > 0

  always:
    - name: Remove the temporary zone folder
      ansible.builtin.file:
        path: "{{ bind9_zone_tmp.path }}"
        state: absent
      when: bind9_zone_tmp.path is defined
