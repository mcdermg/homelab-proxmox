---
# roles/postgres/tasks/main.yaml
- name: Check if postgres container already configured (inithooks completed)
  ansible.builtin.shell:
    cmd: "pct exec {{ postgres_ctid }} -- stat -c %s /etc/inithooks.conf 2>/dev/null || echo 999"
  register: postgres_inithooks_check
  become: true
  changed_when: false

- name: Set postgres configuration status
  ansible.builtin.set_fact:
    postgres_needs_config: "{{ postgres_inithooks_check.stdout | int > 1 }}"

- name: Stop postgres container if needs configuration
  community.proxmox.proxmox:
    api_host: "{{ pm_api_host }}"
    api_token_id: "{{ pm_api_token_id }}"
    api_token_secret: "{{ pm_api_token_secret }}"
    node: "{{ pm_node }}"
    vmid: "{{ postgres_ctid }}"
    state: stopped
  when: postgres_needs_config

- name: Mount postgres container for file operations
  ansible.builtin.command:
    cmd: "pct mount {{ postgres_ctid }}"
  become: true
  changed_when: false
  when: postgres_needs_config

- name: Configure postgres inithooks.conf
  ansible.builtin.template:
    src: inithooks.conf.j2
    dest: "/var/lib/lxc/{{ postgres_ctid }}/rootfs/etc/inithooks.conf"
    mode: '0644'
    owner: 100000
    group: 100000
  become: true
  notify: Start postgres container
  when: postgres_needs_config

- name: Ensure .ssh directory exists
  ansible.builtin.file:
    path: "/var/lib/lxc/{{ postgres_ctid }}/rootfs/root/.ssh"
    state: directory
    mode: '0700'
    owner: 100000
    group: 100000
  become: true
  when: postgres_needs_config

- name: Add SSH public key to authorized_keys
  ansible.builtin.copy:
    content: "{{ lxc_ssh_public_key }}\n"
    dest: "/var/lib/lxc/{{ postgres_ctid }}/rootfs/root/.ssh/authorized_keys"
    mode: '0600'
    owner: 100000
    group: 100000
  become: true
  when: postgres_needs_config

- name: Create Ansible remote_tmp directory to prevent permission warnings
  ansible.builtin.file:
    path: "/var/lib/lxc/{{ postgres_ctid }}/rootfs/root/.ansible/tmp"
    state: directory
    mode: '0700'
    owner: 100000
    group: 100000
  become: true
  when: postgres_needs_config

- name: Create postgres init script in firstboot hooks
  ansible.builtin.template:
    src: postgres-init.sh.j2
    dest: "/var/lib/lxc/{{ postgres_ctid }}/rootfs/usr/lib/inithooks/firstboot.d/99custom-postgres-init"
    mode: '0755'
    owner: 100000
    group: 100000
  become: true
  notify: Start postgres container
  when: postgres_needs_config

- name: Unmount postgres container
  ansible.builtin.command:
    cmd: "pct unmount {{ postgres_ctid }}"
  become: true
  changed_when: false
  when: postgres_needs_config
