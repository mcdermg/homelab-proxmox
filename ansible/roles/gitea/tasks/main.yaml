---
# roles/gitea/tasks/main.yaml
- name: Check if gitea container already configured (inithooks completed)
  ansible.builtin.shell:
    cmd: "pct exec {{ gitea_ctid }} -- stat -c %s /etc/inithooks.conf 2>/dev/null || echo 999"
  register: gitea_inithooks_check
  become: true
  changed_when: false

- name: Set gitea configuration status
  ansible.builtin.set_fact:
    gitea_needs_config: "{{ gitea_inithooks_check.stdout | int > 1 }}"

- name: Wait for postgres container to complete firstboot and all reboots
  ansible.builtin.shell:
    cmd: "pct exec {{ postgres_ctid }} -- stat -c %s /etc/inithooks.conf"
  register: inithooks_size
  until: inithooks_size.stdout | int <= 1
  retries: 120  # 20 minutes for updates + reboots
  delay: 10
  become: true
  changed_when: false
  when: gitea_needs_config

- name: Verify container has stable uptime (not mid-reboot)
  ansible.builtin.command:
    cmd: "pct exec {{ postgres_ctid }} -- awk '{print int($1)}' /proc/uptime"
  register: container_uptime
  until: container_uptime.stdout | int > 60
  retries: 30
  delay: 10
  become: true
  changed_when: false
  when: gitea_needs_config

- name: Wait for PostgreSQL service to be ready
  ansible.builtin.wait_for:
    host: "{{ postgres_ip }}"
    port: 5432
    timeout: 300
  become: true
  when: gitea_needs_config

- name: Verify gitea database exists and is accessible
  ansible.builtin.shell:
    cmd: "pct exec {{ postgres_ctid }} -- su - postgres -c \"psql -d gitea -c 'SELECT 1'\""
  register: db_test
  until: db_test.rc == 0
  retries: 10
  delay: 5
  become: true
  changed_when: false
  when: gitea_needs_config

- name: Stop gitea container if needs configuration
  community.proxmox.proxmox:
    api_host: "{{ pm_api_host }}"
    api_token_id: "{{ pm_api_token_id }}"
    api_token_secret: "{{ pm_api_token_secret }}"
    node: "{{ pm_node }}"
    vmid: "{{ gitea_ctid }}"
    state: stopped
  when: gitea_needs_config

- name: Mount gitea container for file operations
  ansible.builtin.command:
    cmd: "pct mount {{ gitea_ctid }}"
  become: true
  changed_when: false
  when: gitea_needs_config

- name: Create gitea init script in firstboot hooks
  ansible.builtin.template:
    src: gitea-init.sh.j2
    dest: "/var/lib/lxc/{{ gitea_ctid }}/rootfs/usr/lib/inithooks/firstboot.d/99custom-gitea-init"
    mode: '0755'
    owner: 100000
    group: 100000
  become: true
  notify: Start gitea container
  when: gitea_needs_config

- name: Configure gitea inithooks.conf
  ansible.builtin.template:
    src: inithooks.conf.j2
    dest: "/var/lib/lxc/{{ gitea_ctid }}/rootfs/etc/inithooks.conf"
    mode: '0644'
    owner: 100000
    group: 100000
  become: true
  notify: Start gitea container
  when: gitea_needs_config

- name: Ensure .ssh directory exists
  ansible.builtin.file:
    path: "/var/lib/lxc/{{ gitea_ctid }}/rootfs/root/.ssh"
    state: directory
    mode: '0700'
    owner: 100000
    group: 100000
  become: true
  when: gitea_needs_config

- name: Add SSH public key to authorized_keys
  ansible.builtin.copy:
    content: "{{ lxc_ssh_public_key }}\n"
    dest: "/var/lib/lxc/{{ gitea_ctid }}/rootfs/root/.ssh/authorized_keys"
    mode: '0600'
    owner: 100000
    group: 100000
  become: true
  when: gitea_needs_config

- name: Create Ansible remote_tmp directory to prevent permission warnings
  ansible.builtin.file:
    path: "/var/lib/lxc/{{ gitea_ctid }}/rootfs/root/.ansible/tmp"
    state: directory
    mode: '0700'
    owner: 100000
    group: 100000
  become: true
  when: gitea_needs_config

- name: Create ansible configuration marker
  ansible.builtin.copy:
    content: "Configured by Ansible"
    dest: "/var/lib/lxc/{{ gitea_ctid }}/rootfs/root/.ansible_configured"
    mode: '0644'
    owner: 100000
    group: 100000
  become: true
  when: gitea_needs_config

- name: Unmount gitea container
  ansible.builtin.command:
    cmd: "pct unmount {{ gitea_ctid }}"
  become: true
  changed_when: false
  when: gitea_needs_config
