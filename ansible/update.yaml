---
# Update playbook for all Debian-based infrastructure
# Run with: ansible-playbook update.yaml
# Or use --limit to target specific infrastructure:
#   --limit proxmox          - Update only Proxmox host
#   --limit lxc_containers   - Update only LXC containers
#   --limit k3s_cluster      - Update only K3s cluster (VMs + Pis)
#   --limit k3s_pis          - Update only Raspberry Pis
#   --limit postgres         - Update specific host

- name: Update all Debian-based infrastructure
  hosts: debian_hosts
  become: true
  gather_facts: false
  serial: 4 # Update 4 hosts at a time to reduce Proxmox host resource bottleneck. 2x Pis not part of Proxmox.

  roles:
    - system-update

  post_tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} ({{ ansible_host }}) updated successfully"
