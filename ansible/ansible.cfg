[defaults]
inventory = hosts.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
timeout = 30

# Display settings (using modern ansible-core approach instead of deprecated community.general.yaml)
#stdout_callback = ansible.builtin.default
#result_format = yaml
#callbacks_enabled = profile_tasks, timer

# SSH settings
[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
pipelining = True

# Privilege escalation
# Not needed - we connect as root directly
[privilege_escalation]
#become = True
#become_method = sudo
#become_user = root
#become_ask_pass = False
